<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in — SolveSphere</title><link rel="stylesheet" href="/theme.css"><script src="https://unpkg.com/lucide@latest"></script></head><body><main class="auth-page"><section class="auth-side"><div class="brand-lockup"><div class="brand-name">SolveSphere</div></div><div class="auth-side-copy"><div class="eyebrow light">SolveSphere identity</div><h2>A trusted place to turn civic problems into action.</h2><p>Verify your email and select the workspace that matches how you contribute.</p></div></section><section class="auth-main"><div class="auth-box"><div class="brand-lockup"><div class="brand-name">SolveSphere</div></div><div class="auth-heading"><h1 id="title">Welcome back</h1><p id="sub">Choose your role, then continue with email verification.</p></div><form id="form"><div class="field"><label>Login as</label><div class="role-grid login-role-grid" id="roles"><button type="button" class="role-option" data-role="Citizen">Citizen</button><button type="button" class="role-option active" data-role="Student">Student</button><button type="button" class="role-option" data-role="Mentor">Mentor</button><button type="button" class="role-option" data-role="Admin">Admin</button></div></div><div class="field" id="emailBox"><label>Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field" id="codeBox" hidden><label>6-digit verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></div><button class="btn btn-primary" id="submit" type="submit">Send verification code</button><button class="btn btn-secondary" id="back" type="button" hidden>Use another email</button></form><p id="msg" class="notice" hidden></p><div class="auth-switch">New here? <a href="/#signup">Create account</a></div></div></section></main><script>(function(){var A=window.hatchable&&window.hatchable.auth,role=localStorage.getItem('ss_demo_role')||'Student',form=document.getElementById('form'),email=document.getElementById('email'),code=document.getElementById('code'),emailBox=document.getElementById('emailBox'),codeBox=document.getElementById('codeBox'),submit=document.getElementById('submit'),back=document.getElementById('back'),msg=document.getElementById('msg');document.querySelectorAll('[data-role]').forEach(function(b){if(b.dataset.role===role)b.classList.add('active');b.onclick=function(){role=b.dataset.role;localStorage.setItem('ss_demo_role',role);document.querySelectorAll('[data-role]').forEach(function(x){x.classList.toggle('active',x===b)})}});function show(t){msg.hidden=!t;msg.textContent=t}form.onsubmit=function(e){e.preventDefault();submit.disabled=true;if(!codeBox.hidden){var em=localStorage.getItem('ss_pending_email')||email.value.trim();Promise.resolve(A&&A.verifyCode?A.verifyCode({email:em,code:code.value.trim()}):null).catch(function(){}).then(function(){var p={name:(em.split('@')[0]||'SolveSphere User'),email:em,role:role};localStorage.setItem('ss_profile',JSON.stringify(p));localStorage.setItem('ss_page','Dashboard');localStorage.removeItem('ss_auth_step');location.href='/#app'});return}var em=email.value.trim();localStorage.setItem('ss_pending_email',em);localStorage.setItem('ss_email',em);localStorage.setItem('ss_auth_step','code');Promise.resolve(A&&A.startLogin?A.startLogin({email:em}):null).catch(function(){}).then(function(){emailBox.hidden=true;codeBox.hidden=false;back.hidden=false;submit.textContent='Verify & continue';document.getElementById('sub').textContent='Enter the 6-digit code sent to '+em+'.';code.focus();submit.disabled=false})};back.onclick=function(){emailBox.hidden=false;codeBox.hidden=true;back.hidden=true;submit.textContent='Send verification code';document.getElementById('sub').textContent='Choose your role, then continue with email verification.';show('');email.focus()};email.focus()})();</script></body></html>
